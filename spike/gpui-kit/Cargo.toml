[package]
name = "hakonfig-spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = "0.10.0"
hakonfig-core = { path = "../../src-tauri/crates/core" }
anyhow = "1"
rust-embed = "8"
tokio = { version = "1", features = ["rt", "time"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
