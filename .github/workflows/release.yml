name: Release

# Rilis dibuat dari tag, mis. `v0.2.0`. Versi di dalam aplikasi harus sama
# dengan nama tag, kalau tidak job guard berhenti sebelum build.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag yang mau dibangun (mis. v0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Cek versi
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Versi harus konsisten di semua file
        run: bun run version:check

      - name: Tag harus sama dengan versi aplikasi
        id: version
        run: |
          VERSION=$(node scripts/version.mjs show)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          EXPECTED="${GITHUB_REF_NAME}"
          if [ -n "${{ inputs.tag }}" ]; then EXPECTED="${{ inputs.tag }}"; fi
          if [ "$EXPECTED" != "v${VERSION}" ]; then
            echo "::error::ref '$EXPECTED' tidak sama dengan versi aplikasi v${VERSION}"
            echo "Perbaiki dengan: node scripts/version.mjs bump ${EXPECTED#v}"
            exit 1
          fi
          echo "merilis v${VERSION}"

  build:
    name: ${{ matrix.name }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Ubuntu (.deb)
            os: ubuntu-22.04
            args: --bundles deb
            rust-targets: ""
          - name: Windows (NSIS)
            os: windows-latest
            args: --bundles nsis
            rust-targets: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # `dtolnay/rust-toolchain` mengunduh rustup-init sekali dan langsung gagal
      # kalau unduhan itu kena 5xx. Pada v0.4.5 ini menahan rilis dua kali
      # (win.rustup.rs dan sh.rustup.rs sama-sama 504 dari runner). Pasang
      # rustup lebih dulu dengan retry; action di bawah lalu memakai yang ada.
      - name: Bootstrap rustup (retry)
        shell: bash
        run: |
          if command -v rustup >/dev/null 2>&1; then
            echo "rustup sudah tersedia"
            exit 0
          fi
          if [ "${RUNNER_OS}" = "Windows" ]; then
            url="https://win.rustup.rs/x86_64"
            init="rustup-init.exe"
          else
            url="https://sh.rustup.rs"
            init="rustup-init.sh"
          fi
          for attempt in 1 2 3 4 5 6; do
            if curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused \
                 --retry-all-errors --max-time 300 -sSf "$url" -o "$init"; then
              if [ "${RUNNER_OS}" = "Windows" ]; then
                ./"$init" -y --default-toolchain none --profile minimal
              else
                sh "$init" -y --default-toolchain none --profile minimal
              fi
              exit 0
            fi
            echo "unduh rustup-init gagal (percobaan $attempt); ulangi 15 detik"
            sleep 15
          done
          echo "::error::gagal mengunduh rustup-init setelah 6 percobaan"
          exit 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # tauri-action menjalankan beforeBuildCommand (`bun run css`), membangun
      # bundle, lalu mengunggahnya ke draft release dengan tag v<versi>.
      - name: Build & unggah ke draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.guard.outputs.version }}
          releaseName: "Hakonfig v${{ needs.guard.outputs.version }}"
          releaseBody: |
            Hakonfig v${{ needs.guard.outputs.version }}

            | Platform | File |
            |---|---|
            | macOS (universal: Apple Silicon + Intel) | `.dmg` |
            | Windows 10/11 | `.exe` (NSIS installer) |
            | Linux (Debian/Ubuntu) | `.deb` |
            | CLI, semua platform | `hakonfig-cli-<target>` |

            These builds are **unsigned**. On macOS, right click the app and choose
            **Open** the first time. On Windows, SmartScreen may warn you.

            MIT licensed. Setup and usage are documented in the README.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Binary CLI dirilis bersama aplikasi desktop: dibangun dari matrix yang
      # sama supaya tidak ada build terpisah, lalu diunggah ke draft release
      # yang sama yang sudah dibuat tauri-action.
      - name: Build & upload hakonfig-cli
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.guard.outputs.version }}"
          cd src-tauri

          if [ "$RUNNER_OS" = "macOS" ]; then
            # Universal binary: gabungkan kedua arsitektur dengan lipo,
            # mengikuti cara aplikasi desktop dibangun.
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            cargo build --locked --release -p hakonfig-cli --target aarch64-apple-darwin
            cargo build --locked --release -p hakonfig-cli --target x86_64-apple-darwin
            lipo -create \
              target/aarch64-apple-darwin/release/hakonfig-cli \
              target/x86_64-apple-darwin/release/hakonfig-cli \
              -output hakonfig-cli-universal-apple-darwin
            ASSET="hakonfig-cli-universal-apple-darwin"
          else
            cargo build --locked --release -p hakonfig-cli
            TARGET="$(rustc -vV | sed -n 's/^host: //p')"
            SRC="target/release/hakonfig-cli"
            EXT=""
            if [ "$RUNNER_OS" = "Windows" ]; then
              SRC="target/release/hakonfig-cli.exe"
              EXT=".exe"
            fi
            ASSET="hakonfig-cli-${TARGET}${EXT}"
            cp "$SRC" "$ASSET"
          fi

          gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          echo "terunggah: $ASSET"

  # Setelah semua aset CLI terkumpul di draft release: checksums untuk
  # installer, package npm, dan crate crates.io. Dua yang terakhir dilewati
  # dengan pesan jelas kalau secret-nya belum di-set, jadi release desktop
  # tidak pernah terhalang oleh distribusi opsional.
  publish-cli:
    name: "CLI: checksums, npm, crates.io"
    needs: [guard, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Unduh aset CLI dari draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "v${{ needs.guard.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'hakonfig-cli-*' \
            --dir dist
          ls -la dist

      - name: Buat & unggah SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          sha256sum hakonfig-cli-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "v${{ needs.guard.outputs.version }}" \
            SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish ke npm (hakonfig + platform packages)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::notice::NPM_TOKEN belum di-set; publish npm dilewati."
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          node scripts/publish-npm.mjs \
            dist/hakonfig-cli-universal-apple-darwin \
            dist/hakonfig-cli-x86_64-unknown-linux-gnu \
            dist/hakonfig-cli-x86_64-pc-windows-msvc.exe

      - name: Publish ke crates.io (hakonfig-core + hakonfig-cli)
        id: crates
        # crates.io tidak bergantung pada npm: kalau verifikasi npm lambat atau
        # gagal, crate tetap harus terbit (ini yang bikin 0.4.4 tertinggal).
        if: ${{ always() }}
        # Opsional: crates.io bisa menolak publish karena hal yang bukan urusan
        # kode (mis. email akun crates.io belum diverifikasi). Jangan sampai
        # menghalangi aset desktop dan rilisnya.
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN belum di-set; publish crates.io dilewati."
            exit 0
          fi
          cd src-tauri
          cargo publish -p hakonfig-core
          # crates.io perlu waktu mengindeks core sebelum cli bisa memvalidasi
          # dependency-nya.
          sleep 30
          cargo publish -p hakonfig-cli

      - name: Ringkasan kalau crates.io gagal
        if: ${{ steps.crates.outcome == 'failure' }}
        run: |
          echo "::warning::publish crates.io gagal; rilis npm + aset desktop tidak terpengaruh."

  # Draft release hanya bisa diunduh orang lain setelah di-publish. Sebelumnya
  # tidak ada langkah ini, jadi setiap rilis — termasuk 0.4.0 dan 0.4.1 —
  # tertinggal sebagai draft dan tautan unduhan 404.
  publish-release:
    name: "Publish draft release"
    needs: [guard, build, publish-cli]
    # Tetap jalan walau publish-cli gagal: aset desktop sudah lengkap dan tidak
    # boleh ikut tertahan sebagai draft gara-gara npm atau crates.io.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Buka draft jadi rilis publik
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.guard.outputs.version }}"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "::notice::rilis $TAG sudah publik"
