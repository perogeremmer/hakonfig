<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hakonfig</title>
    <link
      rel="preload"
      href="./fonts/PlusJakartaSans-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/PlusJakartaSans-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="h-full bg-canvas font-sans text-ink antialiased">
    <div class="flex h-full flex-col">
      <header id="topbar" class="shrink-0 border-b border-line bg-surface"></header>
      <main id="content" class="min-h-0 flex-1 overflow-y-auto px-6 py-7"></main>
    </div>

    <div id="modal-root"></div>
    <div
      id="toast-root"
      class="pointer-events-none fixed left-1/2 top-20 z-[100] flex w-[380px] max-w-[calc(100vw-2rem)] -translate-x-1/2 flex-col items-stretch gap-2"
    ></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
