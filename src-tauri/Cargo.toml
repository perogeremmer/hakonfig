[package]
name = "hakonfig"
version = "0.6.2"
description = "Kelola konfigurasi provider AI coding harness"
edition = "2021"
license = "MIT"
repository = "https://github.com/perogeremmer/hakonfig"
rust-version = "1.82"

[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
hakonfig-core = { path = "crates/core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
