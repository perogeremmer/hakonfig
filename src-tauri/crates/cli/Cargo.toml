[package]
name = "hakonfig-cli"
version = "0.3.2"
description = "CLI Hakonfig: kelola config harness tanpa GUI"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[[bin]]
name = "hakonfig-cli"
path = "src/main.rs"

[dependencies]
hakonfig-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = "1"
serde_json = "1"
