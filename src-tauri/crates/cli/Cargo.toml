[package]
name = "hakonfig-cli"
version = "0.7.0"
description = "CLI Hakonfig: kelola config harness tanpa GUI"
edition = "2021"
license = "MIT"
repository = "https://github.com/perogeremmer/hakonfig"
homepage = "https://github.com/perogeremmer/hakonfig"
rust-version = "1.82"

[[bin]]
name = "hakonfig-cli"
path = "src/main.rs"

[dependencies]
# `version` wajib untuk publish ke crates.io; lokal tetap memakai `path`.
hakonfig-core = { path = "../core", version = "0.7.0" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = "1"
serde_json = "1"
inquire = "0.9.4"
tokio = { version = "1", features = ["rt"] }
