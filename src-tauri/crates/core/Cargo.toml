[package]
name = "hakonfig-core"
version = "0.6.9"
description = "Hakonfig core: read/modify/write AI harness provider config, no Tauri"
edition = "2021"
license = "MIT"
repository = "https://github.com/perogeremmer/hakonfig"
homepage = "https://github.com/perogeremmer/hakonfig"
rust-version = "1.82"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
jsonc-parser = { version = "0.26", features = ["serde"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
dirs = "6"
# Runtime kecil untuk satu hal: probe katalog di `doctor --online`.
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
